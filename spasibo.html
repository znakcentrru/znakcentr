<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Заявка отправлена — Знакцентр</title>
<meta name="theme-color" content="#1f2326">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231f2326'/><rect x='18' y='44' width='64' height='12' fill='%23ffc61a'/></svg>">
<style>
  @font-face{font-family:"Golos Text";font-style:normal;font-weight:400 600;font-display:swap;src:url(fonts/golos-text-cyrillic.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
  @font-face{font-family:"Golos Text";font-style:normal;font-weight:400 600;font-display:swap;src:url(fonts/golos-text-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:"Roboto Condensed";font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/roboto-condensed-cyrillic.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
  :root{--graphite:#1f2326;--graphite-2:#2b3035;--paper:#f6f6f3;--signal:#ffc61a}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;font-family:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:18px;line-height:1.5;color:var(--graphite);background:var(--paper)}
  .card{width:min(520px,100%);text-align:center;background:var(--signal);border:10px solid var(--graphite);box-shadow:10px 10px 0 var(--graphite);padding:36px 24px}
  h1{margin:0 0 14px;font-family:"Roboto Condensed","Arial Narrow",Arial,sans-serif;font-size:40px;line-height:1.05;font-weight:800}
  p{margin:0 0 22px}
  .btn{display:inline-block;padding:14px 24px;background:var(--graphite);color:#fff;text-decoration:none;font-weight:600;transition:background .2s}
  .btn:hover{background:var(--graphite-2)}
  .btn:focus-visible{outline:3px solid var(--graphite);outline-offset:3px}
  .note{margin:18px 0 0;font-size:15px}
</style>
</head>
<body>
  <main class="card">
    <h1>Заявка отправлена</h1>
    <p>Спасибо! Мы свяжемся с вами в течение рабочего дня.</p>
    <a class="btn" href="./">Вернуться на сайт</a>
    <p class="note">Вы вернётесь на сайт автоматически через несколько секунд.</p>
  </main>
  <script>setTimeout(function () { location.href = './'; }, 6000);</script>
</body>
</html>
